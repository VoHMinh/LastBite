spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── PostgreSQL (JPA) ──────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway DB Migration ───────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}
      repositories:
        enabled: false

  # ── Mail (Gmail SMTP) ──────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

# ── Server ────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ── JWT ───────────────────────────────────────────
jwt:
  signer-key: ${JWT_SIGNER_KEY}
  access-token-duration: ${JWT_ACCESS_TOKEN_DURATION:86400}
  refresh-token-duration: ${JWT_REFRESH_TOKEN_DURATION:604800}

# ── Application ───────────────────────────────────
app:
  admin:
    email: ${ADMIN_EMAIL:admin@lastbite.com}
    password: ${ADMIN_PASSWORD:Admin@123456}
    full-name: ${ADMIN_FULL_NAME:LastBite Admin}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8082,https://willing-snowfield-good.ngrok-free.dev/}
  google: 
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    email-verification-url: ${APP_AUTH_EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/auth/verify-email-link}
    refresh-cookie-secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  aws:
    s3:
      region: ${AWS_REGION:ap-southeast-1}
      bucket-name: ${AWS_S3_BUCKET_NAME:lastbite}
      upload-expire-seconds: ${AWS_S3_UPLOAD_EXPIRE_SECONDS:300}
      access-expire-seconds: ${AWS_S3_ACCESS_EXPIRE_SECONDS:3600}
      max-image-size-mb: ${AWS_S3_MAX_IMAGE_SIZE_MB:5}
      max-video-size-mb: ${AWS_S3_MAX_VIDEO_SIZE_MB:50}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://lastbite.s3.amazonaws.com}
  fcm:
    enabled: ${APP_FCM_ENABLED:false}
    credentials-path: ${APP_FCM_CREDENTIALS_PATH:}
    credentials-base64: ${APP_FCM_CREDENTIALS_BASE64:}
  payments:
    gateway: ${APP_PAYMENTS_GATEWAY:fake}
    return-url: ${APP_PAYMENTS_RETURN_URL:http://localhost:3000/orders/payment-return}
    cancel-url: ${APP_PAYMENTS_CANCEL_URL:http://localhost:3000/orders/payment-cancel}
    reservation-ttl-minutes: ${APP_PAYMENTS_RESERVATION_TTL_MINUTES:10}
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}

# ── Logging ───────────────────────────────────────
logging:
  level:
    root: INFO
    com.LastBite: INFO

# ── Actuator ──────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
