# ═══════════════════════════════════════════════════════════
#  LastBite — Full Stack Local Development
# ═══════════════════════════════════════════════════════════
#
#  Khởi chạy toàn bộ:   docker compose up -d --build
#  Chỉ infra (DB):      docker compose up postgres redis -d
#  Xem logs backend:    docker compose logs -f backend
#  Dừng tất cả:         docker compose down
#  Reset sạch data:     docker compose down -v
#
# ═══════════════════════════════════════════════════════════

name: lastbite-dev

services:

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lastbite-postgres
    environment:
      POSTGRES_DB: lastbite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lastbite"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lastbite-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Spring Boot Backend ──────────────────────────────
  backend:
    image: lastbite-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lastbite-backend
    env_file:
      - .env
    environment:
      # PostgreSQL — dùng tên service "postgres" thay vì "localhost"
      # vì trong Docker network, các container gọi nhau bằng tên service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lastbite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Redis — dùng tên service "redis"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 2s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
