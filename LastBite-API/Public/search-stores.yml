info:
  name: Search Stores
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stores"
  params:
    - name: keyword
      value: bakery
      type: query
      disabled: true
    - name: category
      value: BAKERY
      type: query
      disabled: true
    - name: city
      value: Ho Chi Minh
      type: query
      disabled: true
    - name: district
      value: District 1
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
