info:
  name: Get Store Bags
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stores/:storeId/bags"
  params:
    - name: storeId
      value: "{{storeId}}"
      type: path
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
