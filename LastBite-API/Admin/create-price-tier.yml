info:
  name: Create Price Tier
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/bag-price-tiers"
  body:
    type: json
    data: |-
      {
        "category": "BAKERY",
        "bagSize": "STANDARD",
        "minimumValue": 80000,
        "baseSalePrice": 40000,
        "dynamicMinPrice": 30000,
        "dynamicMaxPrice": 45000,
        "platformFee": 5000,
        "active": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
