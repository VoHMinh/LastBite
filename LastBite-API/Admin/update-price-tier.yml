info:
  name: Update Price Tier
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/admin/bag-price-tiers/:tierId"
  params:
    - name: tierId
      value: "{{tierId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "category": "BAKERY",
        "bagSize": "STANDARD",
        "minimumValue": 85000,
        "baseSalePrice": 42000,
        "dynamicMinPrice": 32000,
        "dynamicMaxPrice": 47000,
        "platformFee": 5000,
        "active": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
