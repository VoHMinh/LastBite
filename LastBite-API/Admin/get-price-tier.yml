info:
  name: Get Price Tier
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/bag-price-tiers/:tierId"
  params:
    - name: tierId
      value: "{{tierId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
