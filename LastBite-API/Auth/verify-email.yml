info:
  name: Verify Email OTP
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "email": "customer@example.com",
        "otpCode": "123456"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
