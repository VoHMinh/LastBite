info:
  name: Refresh Token
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.access_token) {
          bru.setVar("accessToken", res.body.data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
