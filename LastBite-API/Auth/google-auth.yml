info:
  name: Google Auth
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/google"
  body:
    type: json
    data: |-
      {
        "idToken": "paste-google-id-token-here"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
