info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/users/me/password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "Password@123",
        "newPassword": "Password@1234"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
