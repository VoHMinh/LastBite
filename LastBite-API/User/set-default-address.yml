info:
  name: Set Default Address
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me/addresses/:addressId/default"
  params:
    - name: addressId
      value: "{{addressId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
