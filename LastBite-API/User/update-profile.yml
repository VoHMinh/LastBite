info:
  name: Update Profile
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/users/me"
  body:
    type: json
    data: |-
      {
        "fullName": "Demo Customer Updated",
        "phone": "0900000099",
        "avatarUrl": "https://example.com/avatar.jpg"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
