info:
  name: Delete Bag
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/merchant/bags/:bagId"
  params:
    - name: bagId
      value: "{{bagId}}"
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
