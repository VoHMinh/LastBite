info:
  name: Audit Logs
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/merchant/bags/:bagId/audit-logs"
  params:
    - name: bagId
      value: "{{bagId}}"
      type: path
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
