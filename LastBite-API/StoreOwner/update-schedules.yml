info:
  name: Update Schedules
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/store-owner/store/schedules"
  body:
    type: json
    data: |-
      [
        {
          "dayOfWeek": 1,
          "openTime": "08:00:00",
          "closeTime": "20:00:00",
          "isOpen": true
        },
        {
          "dayOfWeek": 2,
          "openTime": "08:00:00",
          "closeTime": "20:00:00",
          "isOpen": true
        }
      ]
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
